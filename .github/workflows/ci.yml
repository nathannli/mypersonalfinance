name: CI

on:
    pull_request:
    push:
      branches: [main]


jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-python@v6
          with:
            python-version: '3.13'
        - uses: pre-commit/action@v3.0.1

    test:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-python@v6
          with:
            python-version: '3.13'
        # setup-uv publishes no floating major tag past v7, so this is a full pin.
        - uses: astral-sh/setup-uv@v10.2.0
          with:
            enable-cache: true
        # --locked installs exactly what uv.lock pins and fails if the lock has
        # drifted from pyproject.toml, rather than silently re-resolving.
        - run: uv sync --locked
        - run: uv run --locked python -m unittest discover -s tests -p 'test_*.py'
