name: CI

on:
    pull_request:
    push:
      branches: [main]


jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-python@v6
          with:
            python-version: '3.13'
        - uses: pre-commit/action@v3.0.1

    test:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-python@v6
          with:
            python-version: '3.13'
        # setup-uv publishes no floating major tag past v7, so this is a full pin.
        - uses: astral-sh/setup-uv@v10.2.0
          with:
            enable-cache: true
        # --frozen is load-bearing on both commands. uv.lock carries a
        # ../Wealthsimpleton path source, which exists on a developer machine but
        # on no runner, so re-resolving dies with
        # "Distribution not found at: file:///.../Wealthsimpleton".
        - run: uv sync --frozen
        - run: uv run --frozen python -m unittest discover -s tests -p 'test_*.py'
